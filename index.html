<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINGUA 50 — Duolingo Style</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;

      --green: #58cc02;
      --green-dark: #46a302;

      --blue: #1cb0f6;
      --blue-dark: #1485bd;

      --purple: #ce82ff;
      --purple-dark: #9e47d6;

      --amber: #ffc800;
      --amber-dark: #d99b00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 92px;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 16px 24px;
    }

    /* Yuqori ixcham status chizig'i */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: #f7f9fa;
      border: 2px solid var(--border);
      border-radius: 16px;
      margin-bottom: 18px;
    }

    .brand {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    .stats {
      display: flex;
      gap: 8px;
      font-weight: 700;
      font-size: 13.5px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 10px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      transition: transform 0.2s ease;
    }

    .stat-pill.bump {
      transform: scale(1.15);
    }

    /* Piko + Nutq pufakchasi */
    .hero {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .mascot-wrap {
      flex: 0 0 100px;
      display: flex;
      justify-content: center;
    }

    .mascot-btn {
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      user-select: none;
      animation: pikoFloat 2.8s ease-in-out infinite;
    }

    .mascot-btn.bounce {
      animation: pikoBounce 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mascot-img {
      width: 96px;
      height: 96px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.09));
    }

    @keyframes pikoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pikoBounce {
      0% { transform: scale(1) translateY(0); }
      35% { transform: scale(1.1, 0.9) translateY(-9px); }
      70% { transform: scale(0.95, 1.05) translateY(1px); }
      100% { transform: scale(1) translateY(0); }
    }

    .bubble {
      position: relative;
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 13px 15px;
      box-shadow: 0 3px 0 var(--border);
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: -9px;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 13px;
      height: 13px;
      background: var(--surface);
      border-left: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
    }

    .bubble-title {
      margin: 0 0 4px;
      font-size: 15.5px;
      font-weight: 800;
    }

    .bubble-sub {
      margin: 0 0 11px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
      min-height: 35px;
    }

    /* Duolingo 3D bosma tugma */
    .duo-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
    }

    .duo-btn--sm {
      padding: 9px 14px;
      font-size: 13px;
      border-radius: 12px;
    }

    .duo-btn--green {
      background: var(--green);
      box-shadow: 0 4px 0 var(--green-dark);
    }

    .duo-btn--green:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--green-dark);
    }

    /* 2x2 Duolingo menyu kartochkalari */
    .grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .duo-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 132px;
      padding: 16px 12px;
      border: none;
      border-radius: 20px;
      color: #ffffff;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
    }

    .duo-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.24),
        transparent
      );
      transform: skewX(-20deg);
      transition: left 0.45s ease;
      pointer-events: none;
    }

    .duo-card:active::after {
      left: 140%;
    }

    .duo-card .icon {
      font-size: 32px;
      line-height: 1;
      margin-bottom: 10px;
      transition: transform 0.14s ease;
    }

    .duo-card:active .icon {
      transform: scale(1.12);
    }

    .duo-card .card-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .duo-card .card-sub {
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0.95;
    }

    .duo-card--green {
      background: var(--green);
      box-shadow: 0 5px 0 var(--green-dark);
    }
    .duo-card--green:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--green-dark);
    }

    .duo-card--blue {
      background: var(--blue);
      box-shadow: 0 5px 0 var(--blue-dark);
    }
    .duo-card--blue:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--blue-dark);
    }

    .duo-card--purple {
      background: var(--purple);
      box-shadow: 0 5px 0 var(--purple-dark);
    }
    .duo-card--purple:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--purple-dark);
    }

    .duo-card--amber {
      background: var(--amber);
      color: #3b2800;
      box-shadow: 0 5px 0 var(--amber-dark);
    }
    .duo-card--amber:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--amber-dark);
    }

    /* Maqsad va Progress bar */
    .goal-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 3px 0 var(--border);
    }

    .goal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 10px;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 24%;
      background: var(--green);
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Pastki navigatsiya paneli */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 2px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      z-index: 20;
    }

    .nav-btn {
      flex: 1;
      max-width: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .nav-btn .nav-icon {
      font-size: 20px;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .nav-btn.is-active {
      color: var(--blue-dark);
      background: #e6f7ff;
      border-color: #90dcff;
    }

    .nav-btn:active .nav-icon {
      transform: translateY(-2px) scale(0.95);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Yuqori panel -->
    <header class="topbar">
      <div class="brand">🇷🇺 LINGUA 50</div>
      <div class="stats">
        <span class="stat-pill" id="xpPill">⭐ <span id="xpVal">250</span></span>
        <span class="stat-pill" id="hpPill">❤️ <span id="hpVal">5</span></span>
        <span class="stat-pill" id="streakPill">🔥 <span id="streakVal">3</span></span>
      </div>
    </header>

    <!-- Piko va nutq pufakchasi -->
    <section class="hero">
      <div class="mascot-wrap">
        <button id="pikoBtn" class="mascot-btn" type="button" aria-label="Piko">
          <img
            class="mascot-img"
            alt="Piko"
            src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M36 84 L16 108 L33 106 L46 88 Z' fill='%232563eb' stroke='%231e3a8a' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M42 86 L28 112 L42 108 L52 90 Z' fill='%23ef4444' stroke='%23991b1b' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cellipse cx='62' cy='72' rx='26' ry='31' fill='%2322c55e' stroke='%2315803d' stroke-width='3'/%3E%3Cellipse cx='70' cy='76' rx='15' ry='21' fill='%2386efac'/%3E%3Cpath d='M44 58 C28 65, 30 87, 50 88 C57 79, 55 66, 44 58 Z' fill='%2316a34a' stroke='%2314532d' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M42 74 C33 78, 35 87, 49 88' fill='%23ef4444'/%3E%3Ccircle cx='68' cy='37' r='22' fill='%2322c55e' stroke='%2315803d' stroke-width='3'/%3E%3Cpath d='M52 20 C58 14, 74 14, 82 22 C74 26, 60 26, 52 20 Z' fill='%23ef4444'/%3E%3Ccircle cx='75' cy='33' r='7.5' fill='%23ffffff' stroke='%23111827' stroke-width='2.2'/%3E%3Ccircle cx='77.5' cy='33' r='3.8' fill='%23111827'/%3E%3Ccircle cx='79' cy='31' r='1.4' fill='%23ffffff'/%3E%3Cpath d='M86 33 C100 33, 102 44, 89 46 C94 50, 89 55, 83 49 Z' fill='%23facc15' stroke='%23ca8a04' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M54 102 L49 113 M49 113 L43 113 M49 113 L53 114' stroke='%234b5563' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M72 102 L72 113 M72 113 L67 113 M72 113 L77 114' stroke='%234b5563' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E"
          />
        </button>
      </div>

      <div class="bubble">
        <h2 class="bubble-title">Salom! Men Piko!</h2>
        <p id="pikoText" class="bubble-sub">Bugun 50 ta soʻz oʻrganamizmi?</p>
        <button id="startBtn" class="duo-btn duo-btn--sm duo-btn--green" type="button">
          Ha, boshlaymiz! ▶
        </button>
      </div>
    </section>

    <!-- 2x2 menyu -->
    <section class="grid-2x2">
      <button class="duo-card duo-card--green" data-tab="home" type="button">
        <span class="icon">🏠</span>
        <span class="card-title">Bosh sahifa</span>
        <span class="card-sub">Asosiy sahifa</span>
      </button>
      <button class="duo-card duo-card--blue" data-tab="words" type="button">
        <span class="icon">📖</span>
        <span class="card-title">Soʻzlar</span>
        <span class="card-sub">50 ta yangi soʻz</span>
      </button>

      <button class="duo-card duo-card--purple" data-tab="quiz" type="button">
        <span class="icon">📝</span>
        <span class="card-title">Test</span>
        <span class="card-sub">Bilimingni sinab koʻr!</span>
      </button>

      <button class="duo-card duo-card--amber" data-tab="results" type="button">
        <span class="icon">🏆</span>
        <span class="card-title">Natijalar</span>
        <span class="card-sub">Sening yutuqlaring</span>
      </button>
    </section>

    <!-- Bugungi maqsad -->
    <section class="goal-card">
      <div class="goal-top">
        <span>🔥 Ketma-ket kunlar: 3 kun</span>
        <span id="goalText">12 / 50 soʻz</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>
  </div>

  <!-- Pastki navigatsiya -->
  <nav class="bottom-nav">
    <button class="nav-btn is-active" data-tab="home" type="button">
      <span class="nav-icon">🏠</span>
      <span>Bosh sahifa</span>
    </button>
    <button class="nav-btn" data-tab="words" type="button">
      <span class="nav-icon">📖</span>
      <span>Soʻzlar</span>
    </button>
    <button class="nav-btn" data-tab="quiz" type="button">
      <span class="nav-icon">📝</span>
      <span>Test</span>
    </button>
    <button class="nav-btn" data-tab="results" type="button">
      <span class="nav-icon">🏆</span>
      <span>Natijalar</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function vibrate(style = "light") {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(style);
      }
    }

    function bumpStat(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove("bump");
      void el.offsetWidth;
      el.classList.add("bump");
    }

    // Piko bosilganda sakrashi va gap almashtirishi
    const pikoBtn = document.getElementById("pikoBtn");
    const pikoText = document.getElementById("pikoText");
    const phrases = [
      "Bugun 50 ta soʻz oʻrganamizmi?",
      "Давай! Har kuni oz-ozdan — zoʻr natija!",
      "Xato qilsang ham qoʻrqma, men yoningdaman!",
      "Ketma-ket 3 kun — super! Davom etamiz!"
    ];
    let phraseIndex = 0;

    pikoBtn.addEventListener("click", () => {
      vibrate("medium");
      pikoBtn.classList.remove("bounce");
      void pikoBtn.offsetWidth;
      pikoBtn.classList.add("bounce");

      phraseIndex = (phraseIndex + 1) % phrases.length;
      pikoText.textContent = phrases[phraseIndex];
    });

    // "Ha, boshlaymiz!" tugmasi
    let learnedWords = 12;
    const targetWords = 50;
    const progressFill = document.getElementById("progressFill");
    const goalText = document.getElementById("goalText");
    const xpVal = document.getElementById("xpVal");

    document.getElementById("startBtn").addEventListener("click", () => {
      vibrate("medium");
      learnedWords = Math.min(targetWords, learnedWords + 5);
      const pct = Math.round((learnedWords / targetWords) * 100);
      progressFill.style.width = pct + "%";
      goalText.textContent = ${learnedWords} / ${targetWords} soʻz;
      xpVal.textContent = Number(xpVal.textContent) + 10;
      bumpStat("xpPill");
    });

    // Tab almashish
    const navButtons = document.querySelectorAll(".nav-btn");
    const cards = document.querySelectorAll(".duo-card");

    function setActiveTab(tabName) {
      vibrate("light");
      navButtons.forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.tab === tabName);
      });
      console.log("Tanlangan bo'lim:", tabName);
    }

    cards.forEach((card) => {
      card.addEventListener("click", () => setActiveTab(card.dataset.tab));
    });
    navButtons.forEach((btn) => {
      btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
    });
  </script>
</body>
</html>
