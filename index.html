<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINGUA 50</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 font-family:Arial,sans-serif;
 color:white;
 background:linear-gradient(140deg,#101329,#21164a,#101329);
}
h1{text-align:center;color:#a98cff}
p{text-align:center;color:#c8c4e8}
.card{
 max-width:600px;margin:20px auto;
 padding:18px;border-radius:18px;
 background:#ffffff12;
 border:1px solid #ffffff20;
}
.word{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;
 padding:13px 5px;border-bottom:1px solid #ffffff20;
}
.ru{font-size:20px;font-weight:bold}
.uz{color:#c9c4e8;margin-top:5px}
button{
 border:0;border-radius:12px;padding:12px;
 background:linear-gradient(90deg,#8055ff,#d34bff);
 color:white;font-size:16px;cursor:pointer;
}
#search{
 width:100%;padding:14px;border-radius:12px;
 border:0;margin-top:15px;font-size:16px;
}
.small{font-size:13px;color:#aaa}
</style>
</head>
<body>

<h1>🚀 LINGUA 50</h1>
<p>Bugungi 50 ta ruscha so‘z</p>

<div class="card">
<input id="search" placeholder="🔍 So‘z qidirish..." oninput="searchWords()">
<div id="words"></div>
<p class="small">🔊 Tugmani bosib ruscha talaffuzni eshiting</p>
</div>

<script>
const data = [
["Привет","Salom"],
["Здравствуйте","Assalomu alaykum"],
["Спасибо","Rahmat"],
["Пожалуйста","Iltimos"],
["Да","Ha"],
["Нет","Yo‘q"],
["Хорошо","Yaxshi"],
["Плохо","Yomon"],
["Дом","Uy"],
["Школа","Maktab"],
["Работа","Ish"],
["Друг","Do‘st"],
["Семья","Oila"],
["Мама","Ona"],
["Папа","Ota"],
["Брат","Aka yoki uka"],
["Сестра","Opa yoki singil"],
["Вода","Suv"],
["Хлеб","Non"],
["Молоко","Sut"],
["Еда","Ovqat"],
["Книга","Kitob"],
["Телефон","Telefon"],
["Машина","Mashina"],
["Город","Shahar"],
["Улица","Ko‘cha"],
["День","Kun"],
["Ночь","Tun"],
["Утро","Ertalab"],
["Вечер","Kechqurun"],
["Сегодня","Bugun"],
["Завтра","Ertaga"],
["Вчера","Kecha"],
["Любовь","Sevgi"],
["Жизнь","Hayot"],
["Счастье","Baxt"],
["Красивый","Chiroyli"],
["Большой","Katta"],
["Маленький","Kichkina"],
["Новый","Yangi"],
["Старый","Eski"],
["Говорить","Gapirmoq"],
["Слушать","Tinglamoq"],
["Читать","O‘qimoq"],
["Писать","Yozmoq"],
["Учиться","O‘qimoq, ta'lim olmoq"],
["Работать","Ishlamoq"],
["Идти","Bormoq"],
["Любить","Sevmoq"],
["Понимать","Tushunmoq"]
];

function speak(word){
 const msg = new SpeechSynthesisUtterance(word);
 msg.lang = "ru-RU";
 msg.rate = 0.85;
 const voices = speechSynthesis.getVoices();
 const female = voices.find(v =>
   v.lang.toLowerCase().startsWith("ru") &&
   /female|жен|milena|irina/i.test(v.name)
 );
 if(female) msg.voice = female;
 speechSynthesis.cancel();
 speechSynthesis.speak(msg);
}

function showWords(list){
 const box = document.getElementById("words");
 box.innerHTML = "";
 list.forEach((item,i)=>{
  box.innerHTML += 
   <div class="word">
    <div>
     <div class="ru">${i+1}. ${item[0]}</div>
     <div class="uz">${item[1]}</div>
    </div>
    <button onclick="speak('${item[0]}')">🔊</button>
   </div>;
 });
}
function searchWords(){
 const q=document.getElementById("search").value.toLowerCase();
 showWords(data.filter(x =>
  x[0].toLowerCase().includes(q) ||
  x[1].toLowerCase().includes(q)
 ));
}
showWords(data);
</script>
</body>
</html>
